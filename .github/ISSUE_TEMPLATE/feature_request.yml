name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved. Clear use cases help us prioritize.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is difficult today?
      placeholder: e.g. I teach math online and need a quick way to insert fraction templates.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
      placeholder: Optional — your idea, mockup, or reference app.

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits most?
      multiple: true
      options:
        - Teachers / presenters
        - Students
        - Teams / collaboration
        - Personal notes / brainstorming
        - Developers / contributors

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I would be willing to help implement this (PR)
        - label: This is a nice-to-have, not blocking my use of Drawora
        - label: This would be a deal-breaker for my workflow

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Other tools or workarounds you have tried.
