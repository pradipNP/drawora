<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Drawora is a free, open-source whiteboard for drawing and notes in the browser."
    />
    <title>Drawora</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M7 21c4-10 14-12 18-8' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="28" height="28">
              <rect width="32" height="32" rx="8" fill="currentColor" />
              <path
                d="M7 21c4-10 14-12 18-8"
                fill="none"
                stroke="#fff"
                stroke-width="2.5"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <h1>Drawora</h1>
        </div>

        <div class="topbar-actions">
          <button
            type="button"
            id="undo-btn"
            class="icon-btn"
            title="Undo (Ctrl+Z)"
            aria-keyshortcuts="Control+Z"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7 8H4l4-4M4 8l4 4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M4 8h9.5a6.5 6.5 0 1 1 0 13H8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
            <span class="visually-hidden">Undo</span>
          </button>
          <button
            type="button"
            id="redo-btn"
            class="icon-btn"
            title="Redo (Ctrl+Y)"
            aria-keyshortcuts="Control+Y Control+Shift+Z"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M17 8h3l-4-4M20 8l-4 4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M20 8h-9.5a6.5 6.5 0 1 0 0 13H16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
            <span class="visually-hidden">Redo</span>
          </button>
          <button
            type="button"
            id="delete-btn"
            class="icon-btn"
            title="Delete (Del)"
            aria-keyshortcuts="Delete Backspace"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5.5 7h13M10 7V5.5A1.5 1.5 0 0 1 11.5 4h1A1.5 1.5 0 0 1 14 5.5V7M8 7l.7 12.2A1.5 1.5 0 0 0 10.2 20.5h3.6a1.5 1.5 0 0 0 1.5-1.3L16 7"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="visually-hidden">Delete</span>
          </button>
        </div>
      </header>

      <div class="workspace">
        <aside class="toolbar" role="toolbar" aria-label="Tools">
          <button
            type="button"
            class="tool-btn"
            data-tool="select"
            aria-pressed="false"
            aria-keyshortcuts="V"
            title="Select (V)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5 4.5 19 12.2l-6.4 1.6L9.8 20.5 5 4.5Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linejoin="round"
              />
            </svg>
            <span class="visually-hidden">Select</span>
          </button>

          <button
            type="button"
            class="tool-btn"
            data-tool="pen"
            aria-pressed="true"
            aria-keyshortcuts="P"
            title="Pen (P)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15.2 5.2 18.8 8.8 8.5 19.1 4.5 19.5l.4-4Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linejoin="round"
              />
              <path
                d="M13.4 7l3.6 3.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
              />
            </svg>
            <span class="visually-hidden">Pen</span>
          </button>

          <button
            type="button"
            class="tool-btn"
            data-tool="eraser"
            aria-pressed="false"
            aria-keyshortcuts="E"
            title="Eraser (E)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15.8 5.4 20 9.6c.8.8.8 2 0 2.8l-7.2 7.2H8.4L4 15.2c-.8-.8-.8-2 0-2.8l8.96-8.96c.8-.8 2.1-.8 2.84-.04Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linejoin="round"
              />
              <path
                d="M8.5 19.6h11"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
            <span class="visually-hidden">Eraser</span>
          </button>

          <hr class="toolbar-rule" />

          <div class="shape-tools" role="group" aria-label="Shapes">
            <button
              type="button"
              class="tool-btn"
              data-tool="line"
              aria-pressed="false"
              title="Line"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M5 19 19 5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                />
              </svg>
              <span class="visually-hidden">Line</span>
            </button>

            <button
              type="button"
              class="tool-btn"
              data-tool="rect"
              aria-pressed="false"
              title="Rectangle"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect
                  x="5"
                  y="6"
                  width="14"
                  height="12"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                />
              </svg>
              <span class="visually-hidden">Rectangle</span>
            </button>

            <button
              type="button"
              class="tool-btn"
              data-tool="roundrect"
              aria-pressed="false"
              title="Rounded rectangle"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect
                  x="5"
                  y="6"
                  width="14"
                  height="12"
                  rx="3.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                />
              </svg>
              <span class="visually-hidden">Rounded rectangle</span>
            </button>

            <button
              type="button"
              class="tool-btn"
              data-tool="ellipse"
              aria-pressed="false"
              title="Ellipse"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <ellipse
                  cx="12"
                  cy="12"
                  rx="8"
                  ry="6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                />
              </svg>
              <span class="visually-hidden">Ellipse</span>
            </button>

            <button
              type="button"
              class="tool-btn"
              data-tool="triangle"
              aria-pressed="false"
              title="Triangle"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 5.5 19.5 18.5h-15Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="visually-hidden">Triangle</span>
            </button>

            <button
              type="button"
              class="tool-btn"
              data-tool="arrow"
              aria-pressed="false"
              title="Arrow"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M5 19 16.5 7.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                />
                <path
                  d="M10.5 7.5h6v6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="visually-hidden">Arrow</span>
            </button>
          </div>

          <hr class="toolbar-rule" />

          <div class="color-targets" role="group" aria-label="Color target">
            <button
              type="button"
              class="color-target"
              data-color-target="stroke"
              aria-pressed="true"
              title="Stroke color"
            >
              <span class="color-target-chip" id="stroke-preview"></span>
              <span class="visually-hidden">Stroke</span>
            </button>
            <button
              type="button"
              class="color-target"
              data-color-target="fill"
              aria-pressed="false"
              title="Fill color"
            >
              <span class="color-target-chip" id="fill-preview"></span>
              <span class="visually-hidden">Fill</span>
            </button>
          </div>

          <div class="swatches" role="group" aria-label="Color">
            <button
              type="button"
              class="swatch"
              data-color="#1c1917"
              style="background-color: #1c1917"
              aria-label="Black"
              aria-pressed="true"
              title="Black"
            ></button>
            <button
              type="button"
              class="swatch"
              data-color="#dc2626"
              style="background-color: #dc2626"
              aria-label="Red"
              aria-pressed="false"
              title="Red"
            ></button>
            <button
              type="button"
              class="swatch"
              data-color="#2563eb"
              style="background-color: #2563eb"
              aria-label="Blue"
              aria-pressed="false"
              title="Blue"
            ></button>
            <button
              type="button"
              class="swatch"
              data-color="#16a34a"
              style="background-color: #16a34a"
              aria-label="Green"
              aria-pressed="false"
              title="Green"
            ></button>
            <button
              type="button"
              class="swatch"
              data-color="#ca8a04"
              style="background-color: #ca8a04"
              aria-label="Yellow"
              aria-pressed="false"
              title="Yellow"
            ></button>
            <button
              type="button"
              class="swatch"
              data-color="#7c3aed"
              style="background-color: #7c3aed"
              aria-label="Purple"
              aria-pressed="false"
              title="Purple"
            ></button>
            <label class="swatch swatch-custom" title="Custom color">
              <span class="visually-hidden">Custom color</span>
              <input
                id="custom-color"
                type="color"
                value="#1c1917"
                aria-label="Custom color"
              />
            </label>
            <button
              type="button"
              class="swatch swatch-none"
              data-color="none"
              aria-label="No fill"
              aria-pressed="false"
              title="No fill"
            ></button>
          </div>

          <hr class="toolbar-rule" />

          <div class="size-control">
            <label class="visually-hidden" for="stroke-size">Stroke size</label>
            <output id="size-value" for="stroke-size">4px</output>
            <input
              id="stroke-size"
              type="range"
              min="0"
              max="4"
              step="1"
              value="1"
              title="Stroke size"
              aria-valuetext="4 pixels"
            />
          </div>
        </aside>

        <main class="canvas-wrap">
          <canvas id="board" aria-label="Whiteboard canvas"></canvas>
        </main>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
